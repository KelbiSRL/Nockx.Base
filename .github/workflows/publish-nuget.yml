name: build

on:
  push:
    branches: [master]
  workflow_dispatch: 
    
jobs:
  native:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit, '###GITLAB-BOT-AUTO-COMMIT-RELEASE###: v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-22.04
          - rid: osx-x64
            os: macos-15-intel
          - rid: osx-arm64
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSSL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt update && sudo apt install -y libssl-dev

      - name: Install OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "CMAKE_EXTRA=-DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV

      - name: Install OpenSSL (Windows, shared, via vcpkg)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          vcpkg install openssl:x64-windows
          echo "CMAKE_EXTRA=-DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows" >> $GITHUB_ENV

      - name: Configure, build, install
        shell: bash
        run: |
          cmake -S "Nockx.Base/C++" -B build -DCMAKE_BUILD_TYPE=Release $CMAKE_EXTRA
          cmake --build build --config Release
          cmake --install build --config Release --prefix out

      - name: Bundle OpenSSL (Linux)
        if: runner.os == 'Linux'
        run: |
          cp -L /usr/lib/x86_64-linux-gnu/libssl.so.3 out/
          cp -L /usr/lib/x86_64-linux-gnu/libcrypto.so.3 out/

      - name: Bundle OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cp "$VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/libssl-3-x64.dll" out/
          cp "$VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/libcrypto-3-x64.dll" out/

      - name: Bundle OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: |
          P=$(brew --prefix openssl@3)/lib
          cp -L $P/libssl.3.dylib $P/libcrypto.3.dylib out/
          chmod u+w out/*.dylib
          cd out
          install_name_tool -id @rpath/libcrypto.3.dylib libcrypto.3.dylib
          install_name_tool -id @rpath/libssl.3.dylib libssl.3.dylib
          for f in libssl.3.dylib libnockx-base.dylib; do
            for dep in $(otool -L $f | awk '/libcrypto.3.dylib|libssl.3.dylib/ {print $1}'); do
              install_name_tool -change "$dep" "@rpath/$(basename $dep)" $f
            done
          done
          codesign --force -s - *.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: out/*

  publish:
    needs: native
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: tmp

      - name: Arrange runtimes folder
        run: |
          for d in tmp/native-*; do
            rid=${d#tmp/native-}
            mkdir -p Nockx.Base/runtimes/$rid/native
            cp $d/* Nockx.Base/runtimes/$rid/native/
          done

      - name: Fetch OpenSSL license
        run: |
          {
            echo "This package bundles OpenSSL (https://www.openssl.org), which is licensed under"
            echo "the Apache License 2.0. Copyright The OpenSSL Project Authors."
            echo
            echo "-----"
            echo
            curl -fsSL https://raw.githubusercontent.com/openssl/openssl/openssl-3.0/LICENSE.txt
          } > Nockx.Base/OPENSSL-LICENSE.txt

      - name: Pack
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          run: |
            VERSION=$(echo "$COMMIT_MSG" | grep -oP '###GITLAB-BOT-AUTO-COMMIT-RELEASE###: v\K[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?' | head -n1 || true)
            if [ -z "$VERSION" ]; then
              VERSION="0.0.0-test.${GITHUB_RUN_NUMBER}"
            fi
            echo "Packing version $VERSION"
            echo "VERSION=$VERSION" >> $GITHUB_ENV
          dotnet pack Nockx.Base/Nockx.Base.csproj -c Release -p:BuildNative=false -p:Version=$VERSION -o nupkg

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: nupkg/*.nupkg

